<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#212529">
    <title>Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            align-items: center;
            background: #f8f9fa;
            color: #212529;
            display: flex;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(33, 37, 41, 0.08);
            max-width: 420px;
            padding: 28px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            line-height: 1.2;
            margin: 0 0 10px;
        }

        p {
            color: #6c757d;
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 20px;
        }

        button {
            background: #212529;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            padding: 10px 14px;
        }
    </style>
</head>
<body>
<main>
    <h1>You are offline</h1>
    <p>The app shell is available, but this page needs a network connection. Reconnect and try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
</main>
</body>
</html>
